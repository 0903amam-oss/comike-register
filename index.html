<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.json">
<title>コミケ現金レジ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f5f6f8;color:#202124}
header{height:58px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:10}
h1{font-size:21px;margin:0}.tabs{height:58px;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:8px;padding:8px 16px;position:sticky;top:58px;z-index:9}
.tabs button,.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:700}.tabs button{background:#eef0f3}.tabs .on,.primary{background:#222;color:#fff}
main{padding:12px 16px;max-width:1400px;margin:auto}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:10px}.card,.panel{background:#fff;border-radius:15px;padding:12px;box-shadow:0 1px 4px #0000000d}
.label{font-size:12px;color:#777}.big{font-size:23px;font-weight:800;margin-top:2px}
.register{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(330px,.9fr);gap:12px;align-items:start}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.product{background:#fff;border:1px solid #ddd;border-radius:13px;overflow:hidden;text-align:left;padding:0}
.product img,.ph{width:100%;height:115px;object-fit:cover;background:#eee}.ph{display:grid;place-items:center;font-size:32px}.pbody{padding:8px}.pbody b{display:block;font-size:14px}.stock{font-size:11px;color:#777;margin-top:3px}
.cart{position:sticky;top:126px;max-height:calc(100vh - 140px);overflow:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #eee}.amount{font-size:30px;font-weight:900}
input,select{width:100%;border:1px solid #ccc;border-radius:10px;padding:11px;font-size:18px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:8px 0}.quick button{background:#eef0f3}
.change{background:#eaf8ee;border-radius:12px;padding:11px;margin:9px 0;font-size:25px;font-weight:900;text-align:center}.checkout{width:100%;font-size:18px;padding:15px}
.box{background:#fff;border-radius:15px;padding:14px;margin-bottom:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:right}th:first-child,td:first-child{text-align:left}.danger{background:#fee;color:#a00}.danger:disabled{opacity:.4}.light{background:#eee}
@media(max-width:800px){.register{grid-template-columns:1fr}.products{grid-template-columns:repeat(3,1fr)}.cart{position:static;max-height:none}}
</style></head><body>
<header><h1>コミケ現金レジ</h1><span id="eventTitle"></span></header>
<nav class="tabs"><button id="tr" class="on" onclick="show('r')">🧾 会計</button><button id="tp" onclick="show('p')">📦 商品管理</button><button id="ts" onclick="show('s')">📊 売上</button><button id="tc" onclick="show('c')">💴 レジ精算</button></nav>
<main id="app"></main>
<script>
const KEY='comike-register-v2-data';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{eventName:'試作イベント',people:['Aさん','Bさん','Cさん'],sales:[],opening:null,final:null,products:[
{id:1,name:'新刊',price:1000,stock:100,initial:100,person:'Aさん',cat:'本',img:''},{id:2,name:'アクスタ',price:1500,stock:50,initial:50,person:'Bさん',cat:'グッズ',img:''},{id:3,name:'缶バッジ',price:500,stock:100,initial:100,person:'Cさん',cat:'グッズ',img:''},{id:4,name:'セット',price:3000,stock:30,initial:30,person:'Bさん',cat:'セット',img:''}]};
if(!db.eventName) db.eventName='試作イベント';
let cart=[]; const den=[10000,5000,1000,500,100,50,10,5,1];
const save=()=>localStorage.setItem(KEY,JSON.stringify(db)), yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');
const sales=()=>db.sales.reduce((a,x)=>a+x.total,0), units=()=>db.sales.flatMap(x=>x.items).reduce((a,x)=>a+x.qty,0);
function renderEventTitle(){const el=document.getElementById('eventTitle');if(el)el.textContent=db.eventName||'試作イベント'}
function show(x){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));document.getElementById('t'+x).classList.add('on');renderEventTitle();({r:reg,p:products,s:report,c:cash})[x]()}
function reg(){let t=cart.reduce((a,x)=>a+x.price*x.qty,0);app.innerHTML=`<div class="stats"><div class="card"><div class="label">本日の売上</div><div class="big">${yen(sales())}</div></div><div class="card"><div class="label">会計件数</div><div class="big">${db.sales.length}件</div></div><div class="card"><div class="label">販売数</div><div class="big">${units()}個</div></div></div><div class="register"><div class="products">${db.products.map(p=>`<button class="product" onclick="add(${p.id})">${p.img?`<img src="${p.img}">`:`<div class="ph">📦</div>`}<div class="pbody"><b>${p.name}</b>${yen(p.price)}<div class="stock">残り ${p.stock}</div></div></button>`).join('')}</div><div class="panel cart"><h3>今回のお会計</h3>${cart.length?cart.map((x,i)=>`<div class="row"><span>${x.name} × ${x.qty}</span><span>${yen(x.price*x.qty)} <button class="btn light" onclick="minus(${i})">−</button></span></div>`).join(''):'<div class="label">商品をタップしてください</div>'}<div class="row"><b>合計</b><b class="amount">${yen(t)}</b></div><input id="recv" inputmode="numeric" type="number" placeholder="お預かり金額" oninput="chg()"><div class="quick"><button class="btn" onclick="exact()">ちょうど</button><button class="btn" onclick="qp(1000)">¥1,000</button><button class="btn" onclick="qp(5000)">¥5,000</button><button class="btn" onclick="qp(10000)">¥10,000</button></div><div id="change" class="change">お釣り ¥0</div><button class="btn primary checkout" onclick="checkout()">会計確定</button></div></div>`}
function add(id){let p=db.products.find(x=>x.id===id);if(p.stock<=0)return alert('在庫切れです');let x=cart.find(x=>x.id===id);if(x){if(x.qty>=p.stock)return alert('在庫数を超えています');x.qty++}else cart.push({...p,qty:1});reg()}
function minus(i){if(--cart[i].qty<=0)cart.splice(i,1);reg()} function total(){return cart.reduce((a,x)=>a+x.price*x.qty,0)}
function chg(){change.textContent='お釣り '+yen(Math.max(0,(Number(recv.value)||0)-total()))} function qp(v){recv.value=v;chg()} function exact(){recv.value=total();chg()}
function checkout(){if(!cart.length)return alert('商品を選択してください');let t=total(),r=Number(recv.value)||0;if(r<t)return alert('お預かり金額が不足しています');db.products.forEach(p=>{let x=cart.find(c=>c.id===p.id);if(x)p.stock-=x.qty});db.sales.push({id:Date.now(),time:new Date().toLocaleString('ja-JP'),total:t,received:r,change:r-t,items:cart.map(x=>({name:x.name,price:x.price,qty:x.qty,person:x.person,cat:x.cat}))});save();cart=[];alert('お釣り '+yen(r-t));reg()}
function products(){app.innerHTML=`<div class="box"><h3>商品登録</h3><div class="grid3"><div>商品名<input id="pn"></div><div>価格<input id="pp" type="number"></div><div>初期在庫<input id="pst" type="number"></div><div>担当者<select id="pe">${db.people.map(x=>`<option>${x}</option>`).join('')}</select></div><div>カテゴリ<input id="pc"></div><div>商品画像<input id="pi" type="file" accept="image/*"></div></div><br><button class="btn primary" onclick="newp()">登録</button></div>
<div class="box"><h3>登録商品</h3>${db.products.map(p=>`<div class="row"><span><b>${p.name}</b> / ${yen(p.price)} / ${p.person} / ${p.cat} / 残${p.stock}</span><span style="display:flex;gap:6px"><button class="btn light" onclick="openProductEditor(${p.id})">編集</button><button class="btn danger" onclick="deleteProduct(${p.id})">削除</button></span></div>`).join('')}</div>
<div id="productEditor"></div>
<div class="box"><h3>イベント設定</h3><p class="label">画面右上に表示するイベント名を変更できます。</p>
<div style="max-width:520px">
  <div>イベント名<input id="eventNameInput" value="${escapeHtml(db.eventName||'試作イベント')}"></div>
</div>
<br><button class="btn primary" onclick="saveEventName()">イベント名を保存</button></div>
<div class="box"><h3>担当者設定</h3><p class="label">担当者名を変更すると、商品登録・商品編集・売上集計にも反映されます。</p>
<div class="grid3">
  <div>担当者1<input id="person1" value="${escapeHtml(db.people[0]||'Aさん')}"></div>
  <div>担当者2<input id="person2" value="${escapeHtml(db.people[1]||'Bさん')}"></div>
  <div>担当者3<input id="person3" value="${escapeHtml(db.people[2]||'Cさん')}"></div>
</div>
<br><button class="btn primary" onclick="savePeople()">担当者名を保存</button></div>
<div class="box"><h3>バックアップ / 復元</h3><p class="label">商品・在庫・売上・レジ金をまとめて保存できます。本番前や終了後にバックアップ推奨。</p>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn primary" onclick="backupData()">バックアップ保存</button>
<label class="btn light" style="display:inline-block;cursor:pointer">バックアップから復元<input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreData(event)"></label>
</div></div>`}



function saveEventName(){
  const v = document.getElementById('eventNameInput').value.trim();
  if(!v) return alert('イベント名を入力してください');
  db.eventName = v;
  save();
  renderEventTitle();
  alert('イベント名を変更しました');
  products();
}

function savePeople(){
  const oldPeople = [...db.people];
  const next = [
    document.getElementById('person1').value.trim() || oldPeople[0] || 'Aさん',
    document.getElementById('person2').value.trim() || oldPeople[1] || 'Bさん',
    document.getElementById('person3').value.trim() || oldPeople[2] || 'Cさん'
  ];

  db.products.forEach(p=>{
    const idx = oldPeople.indexOf(p.person);
    if(idx >= 0) p.person = next[idx];
  });

  db.sales.forEach(s=>{
    s.items.forEach(i=>{
      const idx = oldPeople.indexOf(i.person);
      if(idx >= 0) i.person = next[idx];
    });
  });

  db.people = next;
  save();
  alert('担当者名を変更しました');
  products();
}

function backupData(){
  const payload = {
    app:"コミケ現金レジ",
    version:1,
    exportedAt:new Date().toISOString(),
    data:db
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date();
  const pad=n=>String(n).padStart(2,'0');
  const name = `comike-register-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function restoreData(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const parsed = JSON.parse(r.result);
      const incoming = parsed && parsed.data ? parsed.data : parsed;
      if(!incoming || !Array.isArray(incoming.products) || !Array.isArray(incoming.sales)){
        throw new Error('形式が違います');
      }
      const ok = confirm(`このバックアップから復元しますか？\n\n現在のデータは置き換わります。\n商品 ${incoming.products.length}件 / 会計 ${incoming.sales.length}件`);
      if(!ok){ ev.target.value=''; return; }
      db = incoming;
      save();
      cart = [];
      alert('バックアップから復元しました');
      products();
    }catch(e){
      alert('バックアップファイルを読み込めませんでした');
      ev.target.value='';
    }
  };
  r.readAsText(file);
}



function openProductEditor(id){
  const p = db.products.find(x=>x.id===id);
  if(!p) return;
  const box = document.getElementById('productEditor');
  box.innerHTML = `
    <div class="box" style="border:2px solid #ddd">
      <div class="row" style="border-bottom:0;padding-top:0">
        <h3 style="margin:0">商品を編集</h3>
        <button class="btn light" onclick="closeProductEditor()">閉じる</button>
      </div>
      <div class="grid3">
        <div>商品名<input id="en" value="${escapeHtml(p.name)}"></div>
        <div>価格<input id="ep" type="number" value="${p.price}"></div>
        <div>現在庫<input id="es" type="number" value="${p.stock}"></div>
        <div>担当者<select id="eper">${db.people.map(x=>`<option ${x===p.person?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select></div>
        <div>カテゴリ<input id="ec" value="${escapeHtml(p.cat||'')}"></div>
        <div>商品画像<input id="ei" type="file" accept="image/*"></div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;margin-top:12px">
        ${p.img?`<img src="${p.img}" style="width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid #ddd">`:`<div class="ph" style="width:90px;height:90px;border-radius:10px">📦</div>`}
        <div class="label">画像を選ばなければ現在の画像をそのまま使います。</div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn primary" onclick="saveProductEdit(${p.id})">変更を保存</button>
        <button class="btn light" onclick="closeProductEditor()">キャンセル</button>
      </div>
    </div>`;
  box.scrollIntoView({behavior:'smooth',block:'start'});
}
function closeProductEditor(){
  const box=document.getElementById('productEditor');
  if(box) box.innerHTML='';
}
function saveProductEdit(id){
  const p = db.products.find(x=>x.id===id);
  if(!p) return;
  const name = document.getElementById('en').value.trim();
  const price = Number(document.getElementById('ep').value);
  const stock = Number(document.getElementById('es').value);
  const person = document.getElementById('eper').value;
  const cat = document.getElementById('ec').value.trim() || 'その他';
  const file = document.getElementById('ei').files[0];

  if(!name) return alert('商品名を入力してください');
  if(!Number.isFinite(price) || price < 0) return alert('価格を正しく入力してください');
  if(!Number.isFinite(stock) || stock < 0) return alert('在庫数を正しく入力してください');

  const apply = img=>{
    p.name=name;
    p.price=price;
    p.stock=stock;
    p.person=person;
    p.cat=cat;
    if(img!==null) p.img=img;
    save();
    products();
  };

  if(!file) return apply(null);
  const r=new FileReader();
  r.onload=()=>apply(r.result);
  r.readAsDataURL(file);
}
function escapeHtml(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function deleteProduct(id){
  const p = db.products.find(x=>x.id===id);
  if(!p) return;
  const used = db.sales.some(s=>s.items.some(i=>i.name===p.name && i.price===p.price));
  const msg = used
    ? `「${p.name}」を削除しますか？\n\n過去の売上データは残ります。`
    : `「${p.name}」を削除しますか？`;
  if(!confirm(msg)) return;
  db.products = db.products.filter(x=>x.id!==id);
  cart = cart.filter(x=>x.id!==id);
  save();
  products();
}

function newp(){let f=pi.files[0],done=img=>{let n=Number(pst.value)||0;db.products.push({id:Date.now(),name:pn.value||'商品',price:Number(pp.value)||0,stock:n,initial:n,person:pe.value,cat:pc.value||'その他',img:img||''});save();products()};if(!f)return done('');let r=new FileReader();r.onload=()=>done(r.result);r.readAsDataURL(f)}


function csvCell(v){
  const s = String(v ?? '');
  return '"' + s.replace(/"/g,'""') + '"';
}

function exportSalesCSV(){
  if(!db.sales.length) return alert('売上データがありません');

  const rows = [
    ['イベント名','会計日時','会計ID','担当者','カテゴリ','商品名','単価','数量','小計','会計合計','預かり金','お釣り']
  ];

  db.sales.forEach(s=>{
    s.items.forEach(i=>{
      rows.push([
        db.eventName || '',
        s.time || '',
        s.id || '',
        i.person || '',
        i.cat || '',
        i.name || '',
        i.price || 0,
        i.qty || 0,
        (i.price||0)*(i.qty||0),
        s.total || 0,
        s.received || 0,
        s.change || 0
      ]);
    });
  });

  const csv = '\ufeff' + rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  const d = new Date();
  const pad=n=>String(n).padStart(2,'0');
  const safeEvent=(db.eventName||'event').replace(/[\\/:*?"<>|]/g,'_');
  const name=`${safeEvent}-sales-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.csv`;
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

function cancelLastSale(){
  if(!db.sales.length) return alert('取り消せる会計がありません');
  const last = db.sales[db.sales.length-1];
  const itemText = last.items.map(i => `${i.name} × ${i.qty}`).join('\n');
  const ok = confirm(`直前の会計を取り消しますか？\n\n${itemText}\n合計 ${yen(last.total)}\n\n売上から削除し、在庫を戻します。`);
  if(!ok) return;

  last.items.forEach(i=>{
    const p = db.products.find(p=>p.name===i.name && p.price===i.price);
    if(p) p.stock += i.qty;
  });
  db.sales.pop();
  save();
  alert('直前の会計を取り消し、在庫を戻しました');
  report();
}

function report(){let ppl=db.people.map(p=>{let a=db.sales.flatMap(s=>s.items).filter(i=>i.person===p);return[p,a.reduce((s,i)=>s+i.qty,0),a.reduce((s,i)=>s+i.qty*i.price,0)]}),cats={},prods={};db.sales.flatMap(s=>s.items).forEach(i=>{cats[i.cat]=(cats[i.cat]||0)+i.qty*i.price;prods[i.name]=(prods[i.name]||0)+i.qty*i.price});app.innerHTML=`<div class="stats"><div class="card"><div class="label">総売上</div><div class="big">${yen(sales())}</div></div><div class="card"><div class="label">会計</div><div class="big">${db.sales.length}件</div></div><div class="card"><div class="label">販売数</div><div class="big">${units()}個</div></div></div><div class="box"><h3>3人別売上</h3><table>${ppl.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}個</td><td>${yen(x[2])}</td></tr>`).join('')}</table></div><div class="box"><h3>カテゴリ別</h3><table>${Object.entries(cats).map(x=>`<tr><td>${x[0]}</td><td>${yen(x[1])}</td></tr>`).join('')}</table></div><div class="box"><h3>商品別</h3><table>${Object.entries(prods).map(x=>`<tr><td>${x[0]}</td><td>${yen(x[1])}</td></tr>`).join('')}</table></div>
<div class="box"><h3>データ出力</h3><p class="label">売上明細をCSVで保存できます。ExcelやGoogleスプレッドシートで開けます。</p>
<button class="btn primary" onclick="exportSalesCSV()" ${db.sales.length?'':'disabled'}>売上CSVを保存</button></div>
<div class="box"><h3>会計操作</h3><p class="label">誤って確定した場合、直前の会計1件だけ取り消せます。在庫も自動で戻ります。</p>
<button class="btn danger" onclick="cancelLastSale()" ${db.sales.length?'':'disabled'}>直前の会計を取消</button></div>`}
const ct=o=>Object.entries(o||{}).reduce((s,[d,n])=>s+Number(d)*Number(n),0);
function cash(){let o=ct(db.opening),a=ct(db.final),e=o+sales();app.innerHTML=`<div class="box"><h3>開始レジ金</h3>${den.map(d=>`<div class="row"><span>${yen(d)}</span><input style="width:110px" id="o${d}" type="number" value="${db.opening?.[d]||0}"><span>枚</span></div>`).join('')}<div class="row"><b>合計</b><b>${yen(o)}</b></div><button class="btn primary" onclick="openSave()">保存</button></div><div class="box"><h3>終了レジ精算</h3>${den.map(d=>`<div class="row"><span>${yen(d)}</span><input style="width:110px" id="f${d}" type="number" value="${db.final?.[d]||0}"><span>枚</span></div>`).join('')}<div class="row"><b>理論残高</b><b>${yen(e)}</b></div><div class="row"><b>実残高</b><b>${yen(a)}</b></div><div class="row"><b>過不足</b><b>${yen(a-e)}</b></div><button class="btn primary" onclick="finalSave()">精算保存</button></div>`}
function openSave(){db.opening={};den.forEach(d=>db.opening[d]=Number(document.getElementById('o'+d).value)||0);save();cash()}function finalSave(){db.final={};den.forEach(d=>db.final[d]=Number(document.getElementById('f'+d).value)||0);save();cash()}
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js'); renderEventTitle(); reg();
</script></body></html>
