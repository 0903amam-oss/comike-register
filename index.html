<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff"><link rel="manifest" href="manifest.json">
<title>コミケ現金レジ</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;background:#f5f6f8;color:#202124}
header{height:58px;background:#fff;border-bottom:1px solid #ddd;display:flex;align-items:center;justify-content:space-between;padding:0 18px;position:sticky;top:0;z-index:10}
h1{font-size:21px;margin:0}.tabs{height:58px;background:#fff;border-bottom:1px solid #ddd;display:flex;gap:8px;padding:8px 16px;position:sticky;top:58px;z-index:9}
.tabs button,.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:700}.tabs button{background:#eef0f3}.tabs .on,.primary{background:#222;color:#fff}
main{padding:12px 16px;max-width:1400px;margin:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:10px}.card,.panel{background:#fff;border-radius:15px;padding:12px;box-shadow:0 1px 4px #0000000d}
.label{font-size:12px;color:#777}.big{font-size:23px;font-weight:800;margin-top:2px}
.register{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(330px,.9fr);gap:12px;align-items:start}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.product{background:#fff;border:1px solid #ddd;border-radius:13px;overflow:hidden;text-align:left;padding:0;position:relative}.product.soldout{opacity:.48;filter:grayscale(1)}.soldout-badge{position:absolute;top:8px;left:8px;background:#222;color:#fff;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:800;z-index:2}
.product img,.ph{width:100%;height:115px;object-fit:cover;background:#eee}.ph{display:grid;place-items:center;font-size:32px}.pbody{padding:8px}.pbody b{display:block;font-size:14px}.stock{font-size:11px;color:#777;margin-top:3px}
.cart{position:sticky;top:126px;max-height:calc(100vh - 140px);overflow:auto}.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #eee}.amount{font-size:30px;font-weight:900}
input,select{width:100%;border:1px solid #ccc;border-radius:10px;padding:11px;font-size:18px}.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin:8px 0}.quick button{background:#eef0f3}
.change{background:#eaf8ee;border-radius:12px;padding:11px;margin:9px 0;font-size:25px;font-weight:900;text-align:center}.cash-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.cash-summary .card{min-height:92px}.variance{font-size:32px;font-weight:900;text-align:center;padding:16px;border-radius:14px}.variance.ok{background:#eaf8ee}.variance.plus{background:#e8f2ff}.variance.minus{background:#fff0f0}.cash-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.cash-grid .box{margin-bottom:0}.checkout{width:100%;font-size:18px;padding:15px}
.box{background:#fff;border-radius:15px;padding:14px;margin-bottom:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #eee;text-align:right}th:first-child,td:first-child{text-align:left}.danger{background:#fee;color:#a00}.danger:disabled{opacity:.4}.sale-history{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}.sale-history:last-child{border-bottom:0}.light{background:#eee}
@media(max-width:800px){.register{grid-template-columns:1fr}.products{grid-template-columns:repeat(3,1fr)}.cart{position:static;max-height:none}}
.product-admin-item{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}.product-admin-item:last-child{border-bottom:0}.product-admin-thumb{width:52px;height:52px;border-radius:9px;overflow:hidden;background:#eee;display:grid;place-items:center;font-size:24px;border:1px solid #ddd}.product-admin-thumb img{width:100%;height:100%;object-fit:cover}.product-admin-main{min-width:0}.product-admin-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.toast{position:fixed;top:92px;left:50%;transform:translateX(-50%) translateY(-12px);background:#222;color:#fff;padding:16px 22px;border-radius:12px;font-weight:800;box-shadow:0 8px 24px #0003;z-index:9999;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}</style></head><body>
<header><h1>コミケ現金レジ</h1><span id="eventTitle"></span></header>
<nav class="tabs"><button id="tr" class="on" onclick="show('r')">🧾 会計</button><button id="tp" onclick="show('p')">📦 商品管理</button><button id="ts" onclick="show('s')">📊 売上</button><button id="tc" onclick="show('c')">💴 レジ精算</button></nav>
<div id="toast" class="toast"></div><main id="app"></main>
<script>
const KEY='comike-register-v2-data';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{eventName:'試作イベント',people:['Aさん','Bさん','Cさん'],sales:[],opening:null,final:null,products:[
{id:1,name:'新刊',price:1000,stock:100,initial:100,person:'Aさん',cat:'本',img:''},{id:2,name:'アクスタ',price:1500,stock:50,initial:50,person:'Bさん',cat:'グッズ',img:''},{id:3,name:'缶バッジ',price:500,stock:100,initial:100,person:'Cさん',cat:'グッズ',img:''},{id:4,name:'セット',price:3000,stock:30,initial:30,person:'Bさん',cat:'セット',img:''}]};
if(!db.eventName) db.eventName='試作イベント';
db.products.forEach(p=>{if(p.initial==null) p.initial=Number(p.stock)||0});
let cart=[]; const den=[10000,5000,1000,500,100,50,10,5,1];
const save=()=>localStorage.setItem(KEY,JSON.stringify(db)), yen=n=>'¥'+Number(n||0).toLocaleString('ja-JP');

let toastTimer=null;
function showToast(msg){
  const t=document.getElementById('toast');
  if(!t) return;
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3500);
}

const sales=()=>db.sales.reduce((a,x)=>a+x.total,0), units=()=>db.sales.flatMap(x=>x.items).reduce((a,x)=>a+x.qty,0);
function renderEventTitle(){const el=document.getElementById('eventTitle');if(el)el.textContent=db.eventName||'試作イベント'}
function show(x){document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));document.getElementById('t'+x).classList.add('on');renderEventTitle();({r:reg,p:products,s:report,c:cash})[x]()}
function reg(){let t=cart.reduce((a,x)=>a+x.price*x.qty,0);app.innerHTML=`<div class="stats"><div class="card"><div class="label">本日の売上</div><div class="big">${yen(sales())}</div></div><div class="card"><div class="label">会計件数</div><div class="big">${db.sales.length}件</div></div><div class="card"><div class="label">販売数</div><div class="big">${units()}個</div></div></div><div class="register"><div class="products">${db.products.map(p=>`<button class="product ${p.stock<=0?'soldout':''}" onclick="add(${p.id})" ${p.stock<=0?'disabled':''}>${p.stock<=0?'<span class="soldout-badge">SOLD OUT</span>':''}${p.img?`<img src="${p.img}">`:`<div class="ph">📦</div>`}<div class="pbody"><b>${p.name}</b>${yen(p.price)}<div class="stock">${p.stock<=0?'売り切れ':'残り '+p.stock}</div></div></button>`).join('')}</div><div class="panel cart"><h3>今回のお会計</h3>${cart.length?cart.map((x,i)=>`<div class="row"><span>${x.name} × ${x.qty}</span><span>${yen(x.price*x.qty)} <button class="btn light" onclick="minus(${i})">−</button></span></div>`).join(''):'<div class="label">商品をタップしてください</div>'}<div class="row"><b>合計</b><b class="amount">${yen(t)}</b></div><input id="recv" inputmode="numeric" type="number" placeholder="お預かり金額" oninput="chg()"><div class="quick"><button class="btn" onclick="exact()">ちょうど</button><button class="btn" onclick="qp(1000)">¥1,000</button><button class="btn" onclick="qp(5000)">¥5,000</button><button class="btn" onclick="qp(10000)">¥10,000</button></div><div id="change" class="change">お釣り ¥0</div><button class="btn primary checkout" onclick="checkout()">会計確定</button><button class="btn light" style="width:100%;margin-top:8px" onclick="freeCheckout()">交換・無償で確定</button></div></div>`}
function add(id){let p=db.products.find(x=>x.id===id);if(p.stock<=0)return alert('在庫切れです');let x=cart.find(x=>x.id===id);if(x){if(x.qty>=p.stock)return alert('在庫数を超えています');x.qty++}else cart.push({...p,qty:1});reg()}
function minus(i){if(--cart[i].qty<=0)cart.splice(i,1);reg()} function total(){return cart.reduce((a,x)=>a+x.price*x.qty,0)}
function chg(){change.textContent='お釣り '+yen(Math.max(0,(Number(recv.value)||0)-total()))} function qp(v){recv.value=v;chg()} function exact(){recv.value=total();chg()}
function checkout(){if(!cart.length)return alert('商品を選択してください');let t=total(),r=Number(recv.value)||0;if(r<t)return alert('お預かり金額が不足しています');db.products.forEach(p=>{let x=cart.find(c=>c.id===p.id);if(x)p.stock-=x.qty});db.sales.push({id:Date.now(),type:'paid',time:new Date().toLocaleString('ja-JP'),total:t,received:r,change:r-t,items:cart.map(x=>({productId:x.id,name:x.name,price:x.price,qty:x.qty,person:x.person,cat:x.cat}))});save();cart=[];alert('お釣り '+yen(r-t));reg()}

function freeCheckout(){
  if(!cart.length) return alert('商品を選択してください');
  for(const c of cart){
    const p=db.products.find(p=>p.id===c.id);
    if(!p || p.stock<c.qty) return alert(`「${c.name}」の在庫が足りません`);
  }

  const itemText=cart.map(x=>`${x.name} × ${x.qty}`).join('\n');
  const ok=confirm(`交換・無償として確定しますか？\n\n${itemText}\n\n売上金額は¥0で、在庫だけ減ります。`);
  if(!ok) return;

  db.products.forEach(p=>{
    const x=cart.find(c=>c.id===p.id);
    if(x) p.stock-=x.qty;
  });

  db.sales.push({
    id:Date.now(),
    type:'free',
    time:new Date().toLocaleString('ja-JP'),
    total:0,
    received:0,
    change:0,
    items:cart.map(x=>({
      productId:x.id,
      name:x.name,
      price:x.price,
      qty:x.qty,
      person:x.person,
      cat:x.cat
    }))
  });

  save();
  cart=[];
  reg();
  showToast('✓ 交換・無償として記録しました');
}

function products(){app.innerHTML=`<div class="box"><h3>商品登録</h3><div class="grid3"><div>商品名<input id="pn"></div><div>価格<input id="pp" type="number"></div><div>初期在庫<input id="pst" type="number"></div><div>担当者<select id="pe">${db.people.map(x=>`<option>${x}</option>`).join('')}</select></div><div>カテゴリ<input id="pc"></div><div>商品画像<input id="pi" type="file" accept="image/*"></div></div><br>
<div style="display:flex;align-items:center;gap:12px">
  <button id="productRegisterBtn" class="btn primary" onclick="newp()">登録</button>
  <span id="productRegisterStatus" class="label"></span>
</div></div>
<div class="box" id="registeredProducts"><h3>登録商品</h3><p class="label">↑↓で会計画面の商品表示順を変更できます。</p>${db.products.map((p,idx)=>`
<div class="product-admin-item">
  <div class="product-admin-thumb">${p.img?`<img src="${p.img}" alt="">`:'📦'}</div>
  <div class="product-admin-main"><b>${p.name}</b> / ${yen(p.price)} / ${p.person} / ${p.cat} / 残${p.stock} / 初期${p.initial ?? p.stock}</div>
  <div class="product-admin-actions">
    <button class="btn light" onclick="moveProduct(${p.id},-1)" ${idx===0?'disabled':''}>↑</button>
    <button class="btn light" onclick="moveProduct(${p.id},1)" ${idx===db.products.length-1?'disabled':''}>↓</button>
    <button class="btn light" onclick="openProductEditor(${p.id})">編集</button>
    <button class="btn danger" onclick="deleteProduct(${p.id})">削除</button>
  </div>
</div>`).join('')}</div>
<div id="productEditor"></div>
<div class="box"><h3>イベント設定</h3><p class="label">画面右上に表示するイベント名を変更できます。</p>
<div style="max-width:520px">
  <div>イベント名<input id="eventNameInput" value="${escapeHtml(db.eventName||'試作イベント')}"></div>
</div>
<br><button class="btn primary" onclick="saveEventName()">イベント名を保存</button></div>
<div class="box"><h3>担当者設定</h3><p class="label">担当者名を変更すると、商品登録・商品編集・売上集計にも反映されます。</p>
<div class="grid3">
  <div>担当者1<input id="person1" value="${escapeHtml(db.people[0]||'Aさん')}"></div>
  <div>担当者2<input id="person2" value="${escapeHtml(db.people[1]||'Bさん')}"></div>
  <div>担当者3<input id="person3" value="${escapeHtml(db.people[2]||'Cさん')}"></div>
</div>
<br><button class="btn primary" onclick="savePeople()">担当者名を保存</button></div>
<div class="box"><h3>本番準備</h3>
<p class="label">テスト会計を消して本番開始状態に戻します。商品・画像・担当者・イベント名・商品並び順は残ります。</p>
<p class="label"><b>消えるもの：</b>売上履歴 / 会計件数 / レジ開始金 / 終了精算。商品在庫は「初期在庫」に戻ります。</p>
<button class="btn danger" onclick="resetForEvent()">本番開始用にリセット</button>
</div>
<div class="box"><h3>バックアップ / 復元</h3><p class="label">商品・在庫・売上・レジ金をまとめて保存できます。本番前や終了後にバックアップ推奨。</p>
<div style="display:flex;gap:8px;flex-wrap:wrap">
<button class="btn primary" onclick="backupData()">バックアップ保存</button>
<label class="btn light" style="display:inline-block;cursor:pointer">バックアップから復元<input id="restoreFile" type="file" accept=".json,application/json" style="display:none" onchange="restoreData(event)"></label>
</div></div>`}



function saveEventName(){
  const v = document.getElementById('eventNameInput').value.trim();
  if(!v) return alert('イベント名を入力してください');
  db.eventName = v;
  save();
  renderEventTitle();
  alert('イベント名を変更しました');
  products();
}

function savePeople(){
  const oldPeople = [...db.people];
  const next = [
    document.getElementById('person1').value.trim() || oldPeople[0] || 'Aさん',
    document.getElementById('person2').value.trim() || oldPeople[1] || 'Bさん',
    document.getElementById('person3').value.trim() || oldPeople[2] || 'Cさん'
  ];

  db.products.forEach(p=>{
    const idx = oldPeople.indexOf(p.person);
    if(idx >= 0) p.person = next[idx];
  });

  db.sales.forEach(s=>{
    s.items.forEach(i=>{
      const idx = oldPeople.indexOf(i.person);
      if(idx >= 0) i.person = next[idx];
    });
  });

  db.people = next;
  save();
  alert('担当者名を変更しました');
  products();
}


function resetForEvent(){
  const first = confirm(
    '本番開始用にリセットしますか？\n\n' +
    '・売上履歴を0件にする\n' +
    '・開始レジ金をクリア\n' +
    '・終了精算をクリア\n' +
    '・商品在庫を初期在庫に戻す\n\n' +
    '商品設定・画像・担当者名・イベント名は残ります。\n先にバックアップ保存することをおすすめします。'
  );
  if(!first) return;

  const word = prompt('誤操作防止のため「RESET」と入力してください');
  if(word !== 'RESET') {
    alert('リセットを中止しました');
    return;
  }

  db.sales = [];
  db.opening = null;
  db.final = null;
  db.products.forEach(p=>{
    if(Number.isFinite(Number(p.initial))) p.stock = Number(p.initial);
  });
  cart = [];
  save();
  alert('本番開始状態にリセットしました');
  products();
}

function backupData(){
  const payload = {
    app:"コミケ現金レジ",
    version:1,
    exportedAt:new Date().toISOString(),
    data:db
  };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  const d = new Date();
  const pad=n=>String(n).padStart(2,'0');
  const name = `comike-register-backup-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
function restoreData(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const parsed = JSON.parse(r.result);
      const incoming = parsed && parsed.data ? parsed.data : parsed;
      if(!incoming || !Array.isArray(incoming.products) || !Array.isArray(incoming.sales)){
        throw new Error('形式が違います');
      }
      const ok = confirm(`このバックアップから復元しますか？\n\n現在のデータは置き換わります。\n商品 ${incoming.products.length}件 / 会計 ${incoming.sales.length}件`);
      if(!ok){ ev.target.value=''; return; }
      db = incoming;
      save();
      cart = [];
      alert('バックアップから復元しました');
      products();
    }catch(e){
      alert('バックアップファイルを読み込めませんでした');
      ev.target.value='';
    }
  };
  r.readAsText(file);
}




function moveProduct(id,dir){
  const idx = db.products.findIndex(p=>p.id===id);
  if(idx<0) return;
  const next = idx + dir;
  if(next<0 || next>=db.products.length) return;
  [db.products[idx], db.products[next]] = [db.products[next], db.products[idx]];
  save();
  products();
}

function openProductEditor(id){
  const p = db.products.find(x=>x.id===id);
  if(!p) return;
  const box = document.getElementById('productEditor');
  box.innerHTML = `
    <div class="box" style="border:2px solid #ddd">
      <div class="row" style="border-bottom:0;padding-top:0">
        <h3 style="margin:0">商品を編集</h3>
        <button class="btn light" onclick="closeProductEditor()">閉じる</button>
      </div>
      <div class="grid3">
        <div>商品名<input id="en" value="${escapeHtml(p.name)}"></div>
        <div>価格<input id="ep" type="number" value="${p.price}"></div>
        <div>初期在庫<input id="einit" type="number" value="${p.initial ?? p.stock}"></div>
        <div>現在庫<input id="es" type="number" value="${p.stock}"></div>
        <div>担当者<select id="eper">${db.people.map(x=>`<option ${x===p.person?'selected':''}>${escapeHtml(x)}</option>`).join('')}</select></div>
        <div>カテゴリ<input id="ec" value="${escapeHtml(p.cat||'')}"></div>
        <div>商品画像<input id="ei" type="file" accept="image/*"></div>
      </div>
      <p class="label" style="margin-top:10px">初期在庫＝本番開始時の在庫数です。「本番開始用にリセット」を押すと現在庫がこの数に戻ります。</p>
      <div style="display:flex;gap:8px;align-items:center;margin-top:12px">
        ${p.img?`<img src="${p.img}" style="width:90px;height:90px;object-fit:cover;border-radius:10px;border:1px solid #ddd">`:`<div class="ph" style="width:90px;height:90px;border-radius:10px">📦</div>`}
        <div class="label">画像を選ばなければ現在の画像をそのまま使います。</div>
      </div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="btn primary" onclick="saveProductEdit(${p.id})">変更を保存</button>
        <button class="btn light" onclick="closeProductEditor()">キャンセル</button>
      </div>
    </div>`;
  box.scrollIntoView({behavior:'smooth',block:'start'});
}
function closeProductEditor(){
  const box=document.getElementById('productEditor');
  if(box) box.innerHTML='';
}
function saveProductEdit(id){
  const p = db.products.find(x=>x.id===id);
  if(!p) return;
  const name = document.getElementById('en').value.trim();
  const price = Number(document.getElementById('ep').value);
  const initial = Number(document.getElementById('einit').value);
  const stock = Number(document.getElementById('es').value);
  const person = document.getElementById('eper').value;
  const cat = document.getElementById('ec').value.trim() || 'その他';
  const file = document.getElementById('ei').files[0];

  if(!name) return alert('商品名を入力してください');
  if(!Number.isFinite(price) || price < 0) return alert('価格を正しく入力してください');
  if(!Number.isFinite(initial) || initial < 0) return alert('初期在庫を正しく入力してください');
  if(!Number.isFinite(stock) || stock < 0) return alert('現在庫を正しく入力してください');

  const apply = img=>{
    const before = {...p};
    p.name=name;
    p.price=price;
    p.initial=initial;
    p.stock=stock;
    p.person=person;
    p.cat=cat;
    if(img!==null) p.img=img;
    try{
      save();
    }catch(err){
      Object.assign(p,before);
      console.error(err);
      alert('保存容量が足りず変更を保存できませんでした');
      return;
    }
    products();
    showToast(`✓ 「${name}」を更新しました`);
  };

  if(!file) return apply(null);
  compressProductImage(file, apply, ()=>alert('商品画像を読み込めませんでした'));
}
function escapeHtml(v){
  return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function deleteProduct(id){
  const p = db.products.find(x=>x.id===id);
  if(!p) return;
  const used = db.sales.some(s=>s.items.some(i=>i.name===p.name && i.price===p.price));
  const msg = used
    ? `「${p.name}」を削除しますか？\n\n過去の売上データは残ります。`
    : `「${p.name}」を削除しますか？`;
  if(!confirm(msg)) return;
  db.products = db.products.filter(x=>x.id!==id);
  cart = cart.filter(x=>x.id!==id);
  save();
  products();
}


function compressProductImage(file, callback, onError){
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      try{
        const maxSide = 700;
        let w = img.naturalWidth || img.width;
        let h = img.naturalHeight || img.height;
        const scale = Math.min(1, maxSide / Math.max(w,h));
        w = Math.max(1, Math.round(w*scale));
        h = Math.max(1, Math.round(h*scale));
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        callback(canvas.toDataURL('image/jpeg',0.72));
      }catch(e){ if(onError) onError(e); }
    };
    img.onerror = ()=>onError && onError(new Error('image decode failed'));
    img.src = reader.result;
  };
  reader.onerror = ()=>onError && onError(new Error('file read failed'));
  reader.readAsDataURL(file);
}

function newp(){
  const nameEl = document.getElementById('pn');
  const priceEl = document.getElementById('pp');
  const stockEl = document.getElementById('pst');
  const personEl = document.getElementById('pe');
  const catEl = document.getElementById('pc');
  const imgEl = document.getElementById('pi');
  const btn = document.getElementById('productRegisterBtn');
  const status = document.getElementById('productRegisterStatus');

  if(!nameEl || !priceEl || !stockEl || !personEl || !catEl || !imgEl){
    alert('入力欄の読み込みに失敗しました。画面を開き直してください');
    return;
  }

  const name = nameEl.value.trim();
  const price = Number(priceEl.value);
  const n = Number(stockEl.value);
  const person = personEl.value;
  const cat = catEl.value.trim() || 'その他';
  const file = imgEl.files && imgEl.files[0];

  if(!name) return alert('商品名を入力してください');
  if(!Number.isFinite(price) || price < 0) return alert('価格を正しく入力してください');
  if(!Number.isFinite(n) || n < 0) return alert('初期在庫を正しく入力してください');

  if(btn){
    btn.disabled = true;
    btn.textContent = '登録中…';
  }
  if(status) status.textContent = file ? '画像を読み込んでいます…' : '登録しています…';

  const finish = img=>{
    const product = {
      id:Date.now(),
      name:name,
      price:price,
      stock:n,
      initial:n,
      person:person,
      cat:cat,
      img:img || ''
    };
    db.products.push(product);
    try{
      save();
    }catch(err){
      db.products = db.products.filter(x=>x.id!==product.id);
      console.error(err);
      alert('保存容量が足りず登録できませんでした。画像を軽くしてもう一度お試しください');
      if(btn){ btn.disabled=false; btn.textContent='登録'; }
      if(status) status.textContent='登録できませんでした';
      return;
    }
    products();
    requestAnimationFrame(()=>{
      const list = document.getElementById('registeredProducts');
      if(list) list.scrollIntoView({behavior:'smooth',block:'start'});
      showToast(`✓ 「${name}」を登録しました`);
    });
  };

  if(!file){
    finish('');
    return;
  }

  compressProductImage(file, finish, ()=>{
    if(btn){ btn.disabled=false; btn.textContent='登録'; }
    if(status) status.textContent='画像の読み込みに失敗しました';
    alert('商品画像を読み込めませんでした');
  });
}

function restoreSaleStock(sale){
  sale.items.forEach(i=>{
    let p = null;
    if(i.productId !== undefined && i.productId !== null){
      p = db.products.find(p=>String(p.id)===String(i.productId));
    }
    if(!p){
      p = db.products.find(p=>p.name===i.name && Number(p.price)===Number(i.price));
    }
    if(p) p.stock += Number(i.qty)||0;
  });
}

function cancelSale(id){
  const idx = db.sales.findIndex(s=>String(s.id)===String(id));
  if(idx<0){
    alert('会計データが見つかりません');
    return;
  }
  const sale = db.sales[idx];
  const itemText = sale.items.map(i=>`${i.name} × ${i.qty}`).join('\n');
  const ok = confirm(
    `この会計を取り消しますか？\n\n${itemText}\n合計 ${yen(sale.total)}\n\n売上から削除し、在庫を戻します。`
  );
  if(!ok) return;

  restoreSaleStock(sale);
  db.sales.splice(idx,1);
  try{
    save();
  }catch(err){
    console.error(err);
    alert('取消内容を保存できませんでした');
    return;
  }
  report();
  showToast('✓ 会計を取り消し、在庫を戻しました');
}

function cancelLastSale(){
  if(!db.sales.length){
    alert('取り消せる会計がありません');
    return;
  }
  cancelSale(db.sales[db.sales.length-1].id);
}

  ];

    const freeItems=db.sales.filter(s=>(s.type||'paid')==='free').flatMap(s=>s.items).filter(i=>i.person===person);
    const soldQty=paidItems.reduce((s,i)=>s+(Number(i.qty)||0),0);
    const freeQty=freeItems.reduce((s,i)=>s+(Number(i.qty)||0),0);
    const soldAmount=paidItems.reduce((s,i)=>s+(Number(i.qty)||0)*(Number(i.price)||0),0);
    const products=db.products.filter(p=>p.person===person);
    const initial=products.reduce((s,p)=>s+(Number(p.initial)||0),0);

    const rate=initial>0 ? Math.round(((soldQty+freeQty)/initial)*1000)/10 : 0;
    rows.push([db.eventName||'',person,soldAmount,soldQty,freeQty,initial,remaining,rate+'%']);
  });
  rows.push([

    db.sales.filter(s=>(s.type||'paid')==='free').reduce((s,x)=>s+x.items.reduce((a,i)=>a+(Number(i.qty)||0),0),0),
    db.products.reduce((s,p)=>s+(Number(p.initial)||0),0),
    db.products.reduce((s,p)=>s+(Number(p.stock)||0),0),
    ''
  ]);

  const csv='\ufeff'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');

  const pad=n=>String(n).padStart(2,'0');
  const safeEvent=(db.eventName||'event').replace(/[\\/:*?"<>|]/g,'_');
  a.href=URL.createObjectURL(blob);
  a.download=`${safeEvent}-summary-${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.csv`;
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}

function liveCashTotal(prefix){
  return den.reduce((sum,d)=>{
    const el=document.getElementById(prefix+d);
    return sum + d * Math.max(0, Number(el?.value)||0);
  },0);
}

function updateCashPreview(){
  const openingLive = document.getElementById('o10000') ? liveCashTotal('o') : ct(db.opening);
  const finalLive = document.getElementById('f10000') ? liveCashTotal('f') : ct(db.final);
  const cashSales = sales();
  const expected = openingLive + cashSales;
  const diff = finalLive - expected;

  const openingEl=document.getElementById('summaryOpening');
  const salesEl=document.getElementById('summarySales');
  const expectedEl=document.getElementById('summaryExpected');
  const finalEl=document.getElementById('summaryFinal');
  const varianceEl=document.getElementById('summaryVariance');
  const expectedRow=document.getElementById('expectedRow');
  const finalRow=document.getElementById('finalRow');
  const varianceRow=document.getElementById('varianceRow');
  const openingTotal=document.getElementById('openingTotal');

  if(openingEl) openingEl.textContent=yen(openingLive);
  if(salesEl) salesEl.textContent=yen(cashSales);
  if(expectedEl) expectedEl.textContent=yen(expected);
  if(finalEl) finalEl.textContent=yen(finalLive);
  if(expectedRow) expectedRow.textContent=yen(expected);
  if(finalRow) finalRow.textContent=yen(finalLive);
  if(openingTotal) openingTotal.textContent=yen(openingLive);

  const diffText = diff===0 ? '±¥0' : (diff>0?'+':'−') + yen(Math.abs(diff));
  if(varianceEl){
    varianceEl.textContent=diffText;
    varianceEl.className='variance ' + (diff===0?'ok':diff>0?'plus':'minus');
  }
  if(varianceRow) varianceRow.textContent=diffText;
}

function cash(){
  let o=ct(db.opening), a=ct(db.final), cashSales=sales(), e=o+cashSales, diff=a-e;
  const cls = diff===0 ? 'ok' : diff>0 ? 'plus' : 'minus';
  const diffText = diff===0 ? '±¥0' : (diff>0?'+':'−') + yen(Math.abs(diff));
  app.innerHTML=`

  </div>
  <div class="box">
    <div class="label" style="text-align:center">レジ過不足</div>
    <div id="summaryVariance" class="variance ${cls}">${diffText}</div>

      <button class="btn primary" onclick="finalSave()">終了精算を保存</button>
    </div>
  </div>`;
  updateCashPreview();
}
